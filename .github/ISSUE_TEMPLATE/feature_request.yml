name: Feature request
description: Suggest an idea or an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation your team runs into.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Standcast to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This does not add per-person metrics, rankings or anything sent on someone's behalf without their confirmation
          required: true
