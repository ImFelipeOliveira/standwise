name: Bug report
description: Something doesn't work as expected
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never paste tokens, API keys or private keys here. For security problems use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message or error code if you saw one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /daily in Claude Code
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - /daily skill (Claude Code)
        - MCP server (Cursor, Codex, Claude Desktop, VS Code)
        - CLI
        - Setup page
        - Slack digest, reminder or direct message
        - Linear integration
        - standcast.yml check run
        - Public API or webhooks
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `standcast --version`, if the CLI is involved
  - type: textarea
    id: config
    attributes:
      label: Relevant standcast.yml
      description: Remove anything you don't want to share
      render: yaml
