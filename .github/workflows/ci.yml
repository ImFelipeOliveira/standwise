name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: standwise
          POSTGRES_PASSWORD: standwise
          POSTGRES_DB: standwise
        options: >-
          --health-cmd "pg_isready -U standwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://standwise:standwise@localhost:5433/standwise
      TEST_DATABASE_URL: postgres://standwise:standwise@localhost:5433/standwise_test
    steps:
      - name: checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE standwise_test"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-pins
      - run: bun run check-deps
      - run: bun run typecheck
      - run: bun test
      - name: Build docs site
        env:
          SUPPORT_EMAIL: support@example.com
        run: bun run docs:build
      - run: bun run check-docs
