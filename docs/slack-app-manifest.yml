display_information:
  name: Standwise
  description: Daily standup digests from your team's dailies.
features:
  bot_user:
    display_name: Standwise
    always_online: false
oauth_config:
  redirect_urls:
    - https://standwise.example.com/oauth/slack/callback
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - groups:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
